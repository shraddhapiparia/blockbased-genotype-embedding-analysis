# Phase 1 config for synthetic smoke test only.
# Points to data/synthetic/ — does not affect real-data runs.
# Uses minimal settings: 3 epochs, CPU, single loss function.

data:
  raw_dir: "data/synthetic/region_blocks"
  block_def: "data/synthetic/block_plan/manifest.tsv"
  output_dir: "results/synthetic_test"

runtime:
  device: "cpu"

vae:
  latent_dim_by_snps:
    - [1, 1000000000, 4]   # all blocks → latent_dim 4
  dropout: 0.1
  lr: 0.01
  batch_size: 32
  epochs: 3
  beta_max: 0.5
  beta_warmup: 2
  patience: 5
  grad_clip: 1.0
  val_frac: 0.2
  seed: 42
  cat_weight_clip: 10.0

loss_functions: ["MSE","BCE","MSE_STD","ORD","CAT"]

tuning:
  enabled: false
  loss: "MSE"
  metric: "bal_acc_va"
  blocks: []
  params:
    dropout: [0.1]
    lr: [0.01]
    beta_max: [0.5]

representative:
  blocks: []
  metric: "bal_acc_va"
  top_k: 1
  bottom_k: 1
