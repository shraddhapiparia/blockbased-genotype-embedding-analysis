# Phase 2 config for synthetic smoke test only.
# Reads from results/synthetic_test (Phase 1 synthetic output).
# Uses minimal settings: 3 epochs, tiny model, CPU, 2 k-values only.

phase1_dir: "results/synthetic_test"
output_dir: "results/synthetic_test2"

attention:
  d_model: 16        # must be divisible by n_heads
  n_heads: 2
  n_layers: 1
  d_ff: 32
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  epochs: 3
  patience: 5
  grad_clip: 1.0
  seed: 42
  extract_self_attn: true
  save_full_self_attn: false
  device: cpu

clustering:
  k_range: [2, 3]
  use_hdbscan: false   # disabled: not meaningful on 30 synthetic subjects
  hdbscan_min_size: 5
  umap_n_neighbors: 5
  umap_min_dist: 0.1
  umap_seed: 42

loss_functions: ["ORD"]
